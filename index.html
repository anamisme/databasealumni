<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Database Alumni – Yayasan Baitul Hikmah</title>
<link rel="icon" type="image/png" href="favicon.png" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green-dark: #004d25;
    --green-main: #007a3e;
    --green-light: #e6f7ed;
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,.06);
    --shadow-md: 0 8px 24px rgba(0,0,0,.08);
    --shadow-lg: 0 12px 40px rgba(0,0,0,.12);
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 100%);
    min-height: 100vh; color: #1f2937;
  }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(160deg, #003d1e 0%, #006633 40%, #00944a 100%);
    padding: 2.5rem 1.5rem 6rem;
    position: relative; overflow: hidden;
    text-align: center;
  }
  .header::before {
    content: ''; position: absolute; top: -100px; right: -80px;
    width: 300px; height: 300px; border-radius: 50%;
    background: rgba(255,255,255,.04);
  }
  .header::after {
    content: ''; position: absolute; bottom: -60px; left: -50px;
    width: 200px; height: 200px; border-radius: 50%;
    background: rgba(255,255,255,.03);
  }
  .header-inner {
    max-width: 720px; margin: 0 auto; position: relative; z-index: 1;
  }

  /* Brand */
  .brand {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; margin-bottom: 2rem;
  }
  .brand-icon {
    width: 56px; height: 56px; border-radius: var(--radius-md);
    background: rgba(255,255,255,.15); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,.2);
  }
  .brand-icon img { width: 100%; height: 100%; object-fit: cover; }
  .brand-text { text-align: left; }
  .brand h1 { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -.02em; }
  .brand p { font-size: 12px; color: rgba(255,255,255,.6); margin-top: 2px; }

  /* Lembaga Tabs */
  .lembaga-tabs {
    display: flex; gap: 8px; justify-content: center;
    flex-wrap: wrap; margin-bottom: 1.5rem;
  }
  .lembaga-tab {
    padding: 8px 18px; border-radius: 99px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: 1.5px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.08); color: rgba(255,255,255,.7);
    transition: all .2s ease; backdrop-filter: blur(4px);
  }
  .lembaga-tab:hover {
    background: rgba(255,255,255,.15); color: #fff;
    border-color: rgba(255,255,255,.4);
  }
  .lembaga-tab.active {
    background: rgba(255,255,255,.25); color: #fff;
    border-color: rgba(255,255,255,.6);
    box-shadow: 0 2px 12px rgba(255,255,255,.1);
  }
  .lembaga-tab .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 7px; vertical-align: middle;
  }

  /* Search */
  .search-wrapper {
    max-width: 480px; margin: 0 auto;
  }
  .search-field {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,.12); border: 1.5px solid rgba(255,255,255,.2);
    border-radius: 99px; padding: 0 20px;
    backdrop-filter: blur(12px); transition: all .2s;
  }
  .search-field:focus-within {
    background: rgba(255,255,255,.18);
    border-color: rgba(255,255,255,.4);
    box-shadow: 0 4px 20px rgba(0,0,0,.1);
  }
  .search-field svg { flex-shrink: 0; opacity: .7; }
  .search-field input {
    flex: 1; background: none; border: none; outline: none;
    font-size: 15px; color: #fff; height: 50px; font-weight: 500;
  }
  .search-field input::placeholder { color: rgba(255,255,255,.45); font-weight: 400; }
  .clear-btn {
    background: rgba(255,255,255,.2); border: none; cursor: pointer;
    color: #fff; font-size: 14px; padding: 4px 8px; border-radius: 50%;
    display: none; transition: background .15s;
  }
  .clear-btn:hover { background: rgba(255,255,255,.3); }
  .search-field input:not(:placeholder-shown) ~ .clear-btn { display: block; }

  /* ── CONTENT ── */
  .content {
    max-width: 720px; margin: -3.5rem auto 0;
    padding: 0 1.25rem 4rem; position: relative; z-index: 2;
  }

  /* Lembaga info bar */
  .lembaga-bar {
    background: #fff; border-radius: var(--radius-md);
    box-shadow: var(--shadow-md); padding: 1rem 1.25rem;
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 1.25rem;
    border: 1px solid rgba(0,0,0,.04);
  }
  .lembaga-color-dot {
    width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  .lembaga-bar-name { font-size: 15px; font-weight: 700; color: #111827; }
  .lembaga-bar-sub { font-size: 13px; color: #6b7280; margin-left: auto; font-weight: 500; }

  /* Stats */
  .stats-bar {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 12px; margin-bottom: 1.5rem;
  }
  .stat-card {
    background: #fff; border-radius: var(--radius-md);
    padding: 1.1rem 1rem; box-shadow: var(--shadow-sm);
    text-align: center; border: 1px solid rgba(0,0,0,.04);
    transition: transform .15s, box-shadow .15s;
  }
  .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .stat-num { font-size: 26px; font-weight: 800; color: var(--green-main); }
  .stat-label { font-size: 11px; color: #9ca3af; margin-top: 4px; font-weight: 500; text-transform: uppercase; letter-spacing: .03em; }

  .results-meta { font-size: 13px; color: #6b7280; margin-bottom: 12px; min-height: 20px; font-weight: 500; }
  .results-meta strong { color: #111827; }

  /* Cards */
  .siswa-card {
    background: #fff; border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm); margin-bottom: 12px;
    overflow: hidden; cursor: pointer;
    transition: box-shadow .2s, transform .2s;
    border: 1px solid rgba(0,0,0,.04);
  }
  .siswa-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .card-main { display: flex; align-items: center; gap: 14px; padding: 1.1rem 1.25rem; }
  .avatar {
    width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700; flex-shrink: 0;
  }
  .av-l { background: linear-gradient(135deg, #dcfce7, #bbf7d0); color: #166534; }
  .av-p { background: linear-gradient(135deg, #fce7f3, #fbcfe8); color: #9d174d; }
  .card-info { flex: 1; min-width: 0; }
  .card-nama {
    font-size: 15px; font-weight: 700; color: #111827;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px;
  }
  .card-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; font-weight: 600; padding: 3px 10px;
    border-radius: 99px; letter-spacing: .01em;
  }
  .badge-alumni { background: #d1fae5; color: #047857; }
  .badge-aktif  { background: #dbeafe; color: #1d4ed8; }
  .badge-gray   { background: #f3f4f6; color: #4b5563; border: 1px solid #e5e7eb; }
  .card-chevron { color: #9ca3af; transition: transform .25s ease; flex-shrink: 0; }
  .siswa-card.open .card-chevron { transform: rotate(180deg); color: var(--green-main); }
  .card-detail {
    display: none; padding: 0 1.25rem 1.25rem;
    border-top: 1px solid #f3f4f6;
    position: relative; overflow: hidden;
  }
  .card-detail::before {
    content: ''; position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 100%; height: 100%;
    background: url('logo.png') center/20% no-repeat;
    opacity: .06; pointer-events: none;
  }
  .siswa-card.open .card-detail { display: block; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding-top: 1.1rem; }
  .detail-item label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: #9ca3af; display: block; margin-bottom: 3px; font-weight: 600;
  }
  .detail-item span { font-size: 14px; font-weight: 600; color: #1f2937; }
  .prestasi-section { margin-top: 1.1rem; }
  .prestasi-section > label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: #9ca3af; display: block; margin-bottom: 8px; font-weight: 600;
  }
  .prestasi-item {
    display: flex; align-items: flex-start; gap: 8px;
    font-size: 13px; color: #374151; margin-bottom: 5px; line-height: 1.5; font-weight: 500;
  }

  /* State boxes */
  .state-box {
    background: #fff; border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm); padding: 3rem 2rem; text-align: center;
    border: 1px solid rgba(0,0,0,.04);
  }
  .state-box .icon { font-size: 40px; margin-bottom: 1rem; }
  .state-box h3 { font-size: 17px; color: #111827; font-weight: 700; margin-bottom: 8px; }
  .state-box p { font-size: 14px; color: #6b7280; line-height: 1.6; }
  .loader {
    display: inline-block; width: 28px; height: 28px;
    border: 3px solid #e5e7eb; border-top-color: var(--green-main);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer {
    text-align: center; font-size: 12px; color: #9ca3af;
    padding: 2rem 1rem; max-width: 720px; margin: 0 auto;
    border-top: 1px solid #f3f4f6;
  }

  .admin-btn {
    position: fixed; bottom: 20px; right: 20px;
    width: 40px; height: 40px; border-radius: 50%;
    background: #fff; border: 1px solid #e5e7eb;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .2s; text-decoration: none;
    z-index: 99;
  }
  .admin-btn:hover { background: var(--green-main); border-color: var(--green-main); }
  .admin-btn:hover svg { stroke: #fff; }
  .admin-btn svg { stroke: #6b7280; transition: stroke .2s; }

  @media (max-width: 480px) {
    .header { padding: 2rem 1rem 5rem; }
    .brand h1 { font-size: 16px; }
    .search-wrapper { max-width: 100%; }
    .detail-grid { grid-template-columns: 1fr; }
    .stats-bar { gap: 8px; }
    .stat-num { font-size: 22px; }
    .stat-card { padding: .9rem .75rem; }
    .lembaga-tab { font-size: 12px; padding: 7px 14px; }
    .content { padding: 0 1rem 3rem; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">
        <img src="logo.png" alt="Logo Yayasan Baitul Hikmah">
      </div>
      <div class="brand-text">
        <h1>Database Alumni</h1>
        <p>Yayasan Baitul Hikmah – Kab. Pekalongan</p>
      </div>
    </div>

    <div class="lembaga-tabs" id="lembagaTabs"></div>

    <div class="search-wrapper">
      <div class="search-field">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="white">
          <circle cx="11" cy="11" r="7" stroke-width="2.5"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Cari nama alumni…" autocomplete="off" />
        <button class="clear-btn" id="clearBtn" aria-label="Hapus">✕</button>
      </div>
    </div>
  </div>
</div>

<div class="content">

  <div class="lembaga-bar" id="lembagaBar">
    <div class="lembaga-color-dot" id="lembagaDot"></div>
    <span class="lembaga-bar-name" id="lembagaName">–</span>
    <span class="lembaga-bar-sub" id="lembagaSub">Memuat…</span>
  </div>

  <div class="stats-bar">
    <div class="stat-card"><div class="stat-num" id="statTotal">–</div><div class="stat-label">Total Alumni</div></div>
    <div class="stat-card"><div class="stat-num" id="statL">–</div><div class="stat-label">Laki-laki</div></div>
    <div class="stat-card"><div class="stat-num" id="statP">–</div><div class="stat-label">Perempuan</div></div>
  </div>

  <div class="results-meta" id="resultsMeta"></div>
  <div id="listArea">
    <div class="state-box"><div class="loader"></div><p style="margin-top:1rem">Memuat data…</p></div>
  </div>
</div>

<div class="footer">Hubungi kami via email untuk informasi & koreksi data: <a href="mailto:contact@yayasanbaitulhikmah.com" style="color:#007a3e;text-decoration:none;font-weight:500;">contact@yayasanbaitulhikmah.com</a></div>

<a href="admin.html" class="admin-btn" title="Panel Admin">
  <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke-width="2">
    <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</a>

<script>
// ══════════════════════════════════════════════════════════════
//  ⚙️  KONFIGURASI LEMBAGA
// ══════════════════════════════════════════════════════════════
const SPREADSHEET_ID = "2PACX-1vRf-zF63xFExIF5mbavvxz4XKorOHHdJ4iLeUlglG60zvflcfou3K18jhddNFedRaDOfbu-yaGm5l0-";

const LEMBAGA = [
  { nama: "MTS Al-Hikmah Tangkil Kulon",  singkat: "MTs",  gid: "0",          warna: "#4f46e5" },
  { nama: "MIS Al-Hikmah Tangkil Kulon",  singkat: "MIS",  gid: "451330348",  warna: "#0891b2" },
  { nama: "PKBM Al-Hikmah",               singkat: "PKBM", gid: "2060155617", warna: "#059669" },
  { nama: "KB Al-Hikmah",                 singkat: "KB",   gid: "907882709",  warna: "#d97706" },
];

const KOLOM = {
  nama:     "Nama",
  nisn:     "NISN",
  masuk:    "Tahun_Masuk",
  lulus:    "Tahun_Lulus",
  prestasi: "Prestasi",
  gender:   "Jenis_Kelamin",
};
// ══════════════════════════════════════════════════════════════

let allData      = [];
let currentQuery = "";
let currentIdx   = 0;
let cache        = {};

function csvUrl(gid) {
  return `https://docs.google.com/spreadsheets/d/e/${SPREADSHEET_ID}/pub?gid=${gid}&single=true&output=csv`;
}

function buildTabs() {
  const wrap = document.getElementById("lembagaTabs");
  wrap.innerHTML = "";
  LEMBAGA.forEach((l, i) => {
    const btn = document.createElement("button");
    btn.className = "lembaga-tab" + (i === 0 ? " active" : "");
    btn.innerHTML = `<span class="dot" style="background:${l.warna}"></span>${l.singkat}`;
    btn.addEventListener("click", () => switchLembaga(i));
    wrap.appendChild(btn);
  });
}

function switchLembaga(idx) {
  currentIdx = idx;
  currentQuery = "";
  document.getElementById("searchInput").value = "";

  document.querySelectorAll(".lembaga-tab").forEach((t, i) => {
    t.classList.toggle("active", i === idx);
  });

  const l = LEMBAGA[idx];
  document.getElementById("lembagaDot").style.background = l.warna;
  document.getElementById("lembagaName").textContent = l.nama;
  document.getElementById("lembagaSub").textContent = "Memuat…";
  document.getElementById("statTotal").textContent = "–";
  document.getElementById("statL").textContent = "–";
  document.getElementById("statP").textContent = "–";
  document.getElementById("listArea").innerHTML =
    `<div class="state-box"><div class="loader"></div><p style="margin-top:1rem">Memuat data ${escHtml(l.nama)}…</p></div>`;

  if (cache[idx]) {
    allData = cache[idx];
    updateStats();
    render();
    return;
  }

  Papa.parse(csvUrl(l.gid), {
    download: true, header: true, skipEmptyLines: true,
    complete(res) {
      allData = res.data.map(r => ({
        nama:     (r[KOLOM.nama]     || "").trim(),
        nisn:     (r[KOLOM.nisn]     || "").trim(),
        masuk:    (r[KOLOM.masuk]    || "").trim(),
        lulus:    (r[KOLOM.lulus]    || "-").trim(),
        prestasi: (r[KOLOM.prestasi] || "").trim().split("|").map(s=>s.trim()).filter(Boolean),
        gender:   parseGender(r[KOLOM.gender] || ""),
      })).filter(r => r.nama);
      cache[idx] = allData;
      updateStats();
      render();
    },
    error() {
      document.getElementById("lembagaSub").textContent = "Gagal memuat";
      document.getElementById("listArea").innerHTML = `
        <div class="state-box">
          <div class="icon">⚠️</div>
          <h3>Gagal memuat data</h3>
          <p>Pastikan GID sheet <strong>${escHtml(l.singkat)}</strong> sudah benar dan sheet sudah dipublikasikan.</p>
        </div>`;
    }
  });
}

function parseGender(val) {
  const v = val.trim().toLowerCase();
  if (v === "p" || v.includes("perempuan") || v.includes("wanita")) return "P";
  return "L";
}

function updateStats() {
  document.getElementById("statTotal").textContent = allData.length;
  document.getElementById("statL").textContent = allData.filter(s => s.gender === "L").length;
  document.getElementById("statP").textContent = allData.filter(s => s.gender === "P").length;
  document.getElementById("lembagaSub").textContent = allData.length + " alumni terdaftar";
}

function render() {
  const q   = currentQuery.toLowerCase().trim();
  let hasil = allData;
  if (q) hasil = hasil.filter(s => s.nama.toLowerCase().includes(q));

  const meta = document.getElementById("resultsMeta");
  const list = document.getElementById("listArea");

  if (!q) {
    meta.innerHTML = "";
    list.innerHTML = `
      <div class="state-box">
        <div class="icon">🔍</div>
        <h3>Cari nama alumni</h3>
        <p>Masukkan nama untuk menemukan data alumni ${escHtml(LEMBAGA[currentIdx].nama)}.</p>
      </div>`;
    return;
  }

  meta.innerHTML = `Ditemukan <strong>${hasil.length}</strong> alumni untuk "<strong>${escHtml(currentQuery)}</strong>"`;

  if (!hasil.length) {
    list.innerHTML = `
      <div class="state-box">
        <div class="icon">😕</div>
        <h3>Tidak ditemukan</h3>
        <p>Coba gunakan nama lengkap atau ejaan yang berbeda.</p>
      </div>`;
    return;
  }

  list.innerHTML = hasil.map(s => cardHTML(s)).join("");
  list.querySelectorAll(".siswa-card").forEach(c => {
    c.addEventListener("click", () => c.classList.toggle("open"));
  });
}

function initials(nama) {
  return nama.split(" ").slice(0, 2).map(w => w[0] || "").join("").toUpperCase();
}
function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function cardHTML(s) {
  const lu = s.lulus && s.lulus !== "-" ? s.lulus : "–";
  const pr = s.prestasi.length
    ? `<div class="prestasi-section"><label>Prestasi</label>${s.prestasi.map(p=>`<div class="prestasi-item"><span>🏅</span>${escHtml(p)}</div>`).join("")}</div>`
    : "";
  return `
    <div class="siswa-card" role="button" tabindex="0">
      <div class="card-main">
        <div class="avatar av-${s.gender==="P"?"p":"l"}">${initials(s.nama)}</div>
        <div class="card-info">
          <div class="card-nama">${escHtml(s.nama)}</div>
          <div class="card-badges">
            <span class="badge badge-alumni">Alumni</span>
            ${s.lulus && s.lulus !== "-" ? `<span class="badge badge-gray">Lulus ${escHtml(s.lulus)}</span>` : ""}
          </div>
        </div>
        <svg class="card-chevron" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <polyline points="6 9 12 15 18 9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="card-detail">
        <div class="detail-grid">
          <div class="detail-item"><label>Nama Lengkap</label><span>${escHtml(s.nama)}</span></div>
          <div class="detail-item"><label>NISN</label><span>${escHtml(s.nisn) || "–"}</span></div>
          <div class="detail-item"><label>Tahun Masuk</label><span>${escHtml(s.masuk) || "–"}</span></div>
          <div class="detail-item"><label>Tahun Lulus</label><span>${escHtml(lu)}</span></div>
        </div>
        ${pr}
      </div>
    </div>`;
}

// ── Events ────────────────────────────────────────────────────
document.getElementById("searchInput").addEventListener("input", e => {
  currentQuery = e.target.value; render();
});
document.getElementById("clearBtn").addEventListener("click", () => {
  const inp = document.getElementById("searchInput");
  inp.value = ""; currentQuery = ""; render(); inp.focus();
});
document.getElementById("listArea").addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") {
    const c = e.target.closest(".siswa-card");
    if (c) { e.preventDefault(); c.classList.toggle("open"); }
  }
});

// ── Init ──────────────────────────────────────────────────────
buildTabs();
switchLembaga(0);
</script>
</body>
</html>
