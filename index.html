<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Database Alumni – Yayasan Baitul Hikmah</title>
<link rel="icon" type="image/png" href="favicon.png" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --glass: rgba(255,255,255,.12);
    --glass-border: rgba(255,255,255,.18);
    --glass-hover: rgba(255,255,255,.2);
    --glass-active: rgba(255,255,255,.28);
    --glass-card: rgba(255,255,255,.85);
    --glass-card-border: rgba(255,255,255,.6);
    --radius: 22px;
    --radius-pill: 99px;
    --green-main: #007a3e;
    --bg-image: none;
    --bg-size: cover;
    --bg-pos: 50% 50%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
    background-color: #0d7a3e;
    background-image: var(--bg-image), linear-gradient(145deg, #1a4d2e 0%, #0d7a3e 30%, #2ea06a 60%, #1a6b42 100%);
    background-size: var(--bg-size), auto;
    background-position: var(--bg-pos), 0 0;
    background-repeat: no-repeat, repeat;
    min-height: 100vh; color: #1f2937;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  .header {
    padding: 3.5rem 1.5rem 2rem;
    text-align: center;
  }
  .header-inner {
    max-width: 680px; margin: 0 auto;
  }

  /* Brand */
  .brand {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 2.5rem;
  }
  .brand-icon {
    width: 88px; height: 88px; border-radius: 50%;
    background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    border: 1.5px solid var(--glass-border);
    margin-bottom: 1rem;
    box-shadow: 0 8px 32px rgba(0,0,0,.15), inset 0 1px 0 rgba(255,255,255,.2);
  }
  .brand-icon img { width: 100%; height: 100%; object-fit: cover; }
  .brand h1 {
    font-size: 26px; font-weight: 700; color: #fff;
    letter-spacing: -.03em; margin-bottom: 4px;
  }
  .brand p { font-size: 15px; color: rgba(255,255,255,.65); font-weight: 400; }

  /* Lembaga section */
  .lembaga-label {
    font-size: 12px; color: rgba(255,255,255,.5); text-transform: uppercase;
    letter-spacing: .08em; font-weight: 600; margin-bottom: 12px;
  }
  .lembaga-tabs {
    display: flex; gap: 8px; justify-content: center;
    flex-wrap: wrap; margin-bottom: 1.25rem;
  }
  .lembaga-tab {
    padding: 10px 22px; border-radius: var(--radius-pill);
    font-size: 14px; font-weight: 500;
    cursor: pointer; border: 1px solid var(--glass-border);
    background: var(--glass); color: rgba(255,255,255,.7);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    transition: all .4s cubic-bezier(.25,.8,.25,1);
    box-shadow: 0 2px 8px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.1);
  }
  .lembaga-tab:hover {
    background: var(--glass-hover); color: #fff;
    border-color: rgba(255,255,255,.3);
    box-shadow: 0 4px 16px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .lembaga-tab.active {
    background: var(--glass-active); color: #fff;
    border-color: rgba(255,255,255,.5);
    box-shadow: 0 4px 20px rgba(0,0,0,.15), inset 0 1px 0 rgba(255,255,255,.25);
  }

  /* Lembaga name */
  .lembaga-display {
    font-size: 15px; font-weight: 500; color: rgba(255,255,255,.8);
    margin-bottom: 1.75rem;
  }

  /* Search — Liquid Glass style */
  .search-wrapper {
    max-width: 480px; margin: 0 auto;
  }
  .search-field {
    display: flex; align-items: center; gap: 12px;
    background: var(--glass); border: 1px solid var(--glass-border);
    border-radius: var(--radius-pill); padding: 0 20px;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    transition: all .4s cubic-bezier(.25,.8,.25,1);
    box-shadow: 0 4px 16px rgba(0,0,0,.1), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .search-field:focus-within {
    background: var(--glass-hover);
    border-color: rgba(255,255,255,.35);
    box-shadow: 0 8px 32px rgba(0,0,0,.15), inset 0 1px 0 rgba(255,255,255,.2);
  }
  .search-field svg { flex-shrink: 0; opacity: .6; }
  .search-field input {
    flex: 1; background: none; border: none; outline: none;
    font-size: 16px; color: #fff; height: 52px; font-weight: 400;
    letter-spacing: -.01em;
  }
  .search-field input::placeholder { color: rgba(255,255,255,.4); }
  .clear-btn {
    background: rgba(255,255,255,.15); border: none; cursor: pointer;
    color: #fff; font-size: 13px; width: 24px; height: 24px;
    border-radius: 50%; display: none; transition: background .15s;
    line-height: 24px; text-align: center;
  }
  .clear-btn:hover { background: rgba(255,255,255,.25); }
  .search-field input:not(:placeholder-shown) ~ .clear-btn { display: block; }

  /* ── CONTENT ── */
  .content {
    max-width: 680px; margin: 2rem auto 0;
    padding: 0 1.25rem 4rem;
  }

  /* Cards — Liquid Glass */
  .siswa-card {
    background: var(--glass-card);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: var(--radius);
    border: 1px solid var(--glass-card-border);
    box-shadow: 0 4px 24px rgba(0,0,0,.06), inset 0 1px 0 rgba(255,255,255,.8);
    margin-bottom: 12px;
    overflow: hidden; cursor: pointer;
    transition: all .4s cubic-bezier(.25,.8,.25,1);
  }
  .siswa-card:hover {
    box-shadow: 0 12px 40px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.9);
    transform: translateY(-2px);
  }
  .card-main { display: flex; align-items: center; gap: 14px; padding: 14px 18px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; flex-shrink: 0;
  }
  .av-l { background: linear-gradient(135deg, #d1fae5, #a7f3d0); color: #166534; }
  .av-p { background: linear-gradient(135deg, #fce7f3, #fbcfe8); color: #9d174d; }
  .card-info { flex: 1; min-width: 0; }
  .card-nama {
    font-size: 15px; font-weight: 600; color: #111827;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;
    letter-spacing: -.02em;
  }
  .card-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; font-weight: 500; padding: 2px 9px;
    border-radius: var(--radius-pill); letter-spacing: .01em;
  }
  .badge-gray { background: rgba(0,0,0,.05); color: #6b7280; }
  .card-chevron { color: #c4c4c4; flex-shrink: 0; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,.45);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center;
    padding: 1.25rem;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--glass-card);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-radius: var(--radius);
    border: 1px solid var(--glass-card-border);
    box-shadow: 0 16px 60px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.8);
    width: 100%; max-width: 400px;
    padding: 2rem 1.75rem;
    position: relative;
    animation: modalIn .35s cubic-bezier(.25,.8,.25,1);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(.92) translateY(12px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-close {
    position: absolute; top: 14px; right: 16px;
    background: none; border: none; font-size: 20px;
    color: #9ca3af; cursor: pointer; line-height: 1;
    padding: 4px; transition: color .2s;
  }
  .modal-close:hover { color: #1f2937; }
  .modal-body { text-align: center; }
  .modal-avatar {
    width: 110px; height: 110px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 700; margin: 0 auto 1.25rem;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
  }
  .modal-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 16px; text-align: center;
  }
  .modal-item label {
    font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
    color: #9ca3af; display: block; margin-bottom: 3px; font-weight: 600;
  }
  .modal-item span { font-size: 14px; font-weight: 600; color: #1f2937; letter-spacing: -.01em; }

  /* Footer */
  .footer {
    text-align: center; font-size: 12px; color: rgba(255,255,255,.4);
    padding: 2rem 1rem; max-width: 680px; margin: 0 auto;
  }
  .footer a { color: rgba(255,255,255,.6) !important; text-decoration: none; }

  .admin-btn {
    position: fixed; bottom: 20px; right: 20px;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    box-shadow: 0 4px 16px rgba(0,0,0,.1), inset 0 1px 0 rgba(255,255,255,.1);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .4s cubic-bezier(.25,.8,.25,1); text-decoration: none;
    z-index: 99;
  }
  .admin-btn:hover { background: var(--glass-hover); }
  .admin-btn svg { stroke: rgba(255,255,255,.7); transition: stroke .2s; }
  .admin-btn:hover svg { stroke: #fff; }

  @media (max-width: 480px) {
    .header { padding: 2.5rem 1rem 1.5rem; }
    .brand-icon { width: 72px; height: 72px; }
    .brand h1 { font-size: 22px; }
    .brand p { font-size: 13px; }
    .search-wrapper { max-width: 100%; }
    .lembaga-tab { font-size: 13px; padding: 9px 18px; }
    .content { padding: 0 1rem 3rem; }
    .detail-grid { grid-template-columns: 1fr; }
    .detail-avatar { width: 90px; height: 90px; font-size: 28px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">
        <img src="logo.png" alt="Logo Yayasan Baitul Hikmah">
      </div>
      <h1>Database Alumni</h1>
      <p>Yayasan Baitul Hikmah</p>
    </div>

    <p class="lembaga-label">Pilih Lembaga</p>
    <div class="lembaga-tabs" id="lembagaTabs"></div>

    <div class="lembaga-display" id="lembagaDisplay"></div>

    <div class="search-wrapper">
      <div class="search-field">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="white">
          <circle cx="11" cy="11" r="7" stroke-width="2"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Nama lengkap atau NISN" autocomplete="off" />
        <button class="clear-btn" id="clearBtn" aria-label="Hapus">✕</button>
      </div>
    </div>
  </div>
</div>

<div class="content">
  <div id="listArea"></div>
</div>

<div class="footer">Hubungi kami via email untuk informasi & koreksi data: <a href="mailto:contact@yayasanbaitulhikmah.com">contact@yayasanbaitulhikmah.com</a></div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<a href="admin.html" class="admin-btn" title="Panel Admin">
  <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke-width="2">
    <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</a>

<script>
const SPREADSHEET_ID = "2PACX-1vRf-zF63xFExIF5mbavvxz4XKorOHHdJ4iLeUlglG60zvflcfou3K18jhddNFedRaDOfbu-yaGm5l0-";

const LEMBAGA = [
  { nama: "MTS Al-Hikmah Tangkil Kulon",  singkat: "MTs",  gid: "0" },
  { nama: "MIS Al-Hikmah Tangkil Kulon",  singkat: "MIS",  gid: "451330348" },
  { nama: "PKBM Al-Hikmah",               singkat: "PKBM", gid: "2060155617" },
  { nama: "KB Al-Hikmah",                 singkat: "KB",   gid: "907882709" },
];

const KOLOM = {
  nama:   "Nama",
  nisn:   "NISN",
  masuk:  "Tahun_Masuk",
  lulus:  "Tahun_Lulus",
  gender: "Jenis_Kelamin",
  foto:   "Foto",
};

let allData = [], currentQuery = "", currentIdx = 0, cache = {};

function csvUrl(gid) {
  return `https://docs.google.com/spreadsheets/d/e/${SPREADSHEET_ID}/pub?gid=${gid}&single=true&output=csv`;
}

function buildTabs() {
  const wrap = document.getElementById("lembagaTabs");
  wrap.innerHTML = "";
  LEMBAGA.forEach((l, i) => {
    const btn = document.createElement("button");
    btn.className = "lembaga-tab" + (i === 0 ? " active" : "");
    btn.textContent = l.singkat;
    btn.addEventListener("click", () => switchLembaga(i));
    wrap.appendChild(btn);
  });
}

function switchLembaga(idx) {
  currentIdx = idx;
  currentQuery = "";
  document.getElementById("searchInput").value = "";
  document.querySelectorAll(".lembaga-tab").forEach((t, i) => t.classList.toggle("active", i === idx));
  document.getElementById("lembagaDisplay").textContent = LEMBAGA[idx].nama;
  document.getElementById("listArea").innerHTML = "";

  if (cache[idx]) { allData = cache[idx]; render(); return; }

  Papa.parse(csvUrl(LEMBAGA[idx].gid), {
    download: true, header: true, skipEmptyLines: true,
    complete(res) {
      allData = res.data.map(r => ({
        nama:   (r[KOLOM.nama]   || "").trim(),
        nisn:   (r[KOLOM.nisn]   || "").trim(),
        masuk:  (r[KOLOM.masuk]  || "").trim(),
        lulus:  (r[KOLOM.lulus]  || "-").trim(),
        gender: parseGender(r[KOLOM.gender] || ""),
        foto:   parseFoto(r[KOLOM.foto] || ""),
      })).filter(r => r.nama);
      cache[idx] = allData;
      render();
    },
    error() {
      document.getElementById("listArea").innerHTML = `<p style="text-align:center;color:rgba(255,255,255,.5);padding:2rem;">Gagal memuat data.</p>`;
    }
  });
}

function parseGender(v) { v = v.trim().toLowerCase(); return (v==="p"||v.includes("perempuan")||v.includes("wanita")) ? "P" : "L"; }

function parseFoto(url) {
  url = url.trim(); if (!url) return "";
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w200`;
  const o = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (o) return `https://drive.google.com/thumbnail?id=${o[1]}&sz=w200`;
  return url;
}

function render() {
  const q = currentQuery.toLowerCase().trim();
  let hasil = allData;
  if (q) hasil = hasil.filter(s => s.nama.toLowerCase().includes(q) || s.nisn.includes(q));
  const list = document.getElementById("listArea");
  if (!q) { list.innerHTML = ""; return; }
  if (!hasil.length) { list.innerHTML = `<p style="text-align:center;color:rgba(255,255,255,.5);padding:2rem 0;font-size:14px;">Tidak ditemukan.</p>`; return; }
  window._hasilCache = hasil;
  list.innerHTML = hasil.map((s, i) => cardHTML(s, i)).join("");
}

function initials(n) { return n.split(" ").slice(0,2).map(w=>w[0]||"").join("").toUpperCase(); }
function escHtml(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function cardHTML(s, idx) {
  const av = s.foto ? `<img src="${escHtml(s.foto)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : initials(s.nama);
  const verified = s.lulus && s.lulus !== "-"
    ? `<svg width="14" height="14" viewBox="0 0 16 16" style="flex-shrink:0;display:inline-block;vertical-align:-2px;margin-left:4px;" aria-label="Terverifikasi">
        <polygon points="8,0.5 10.487,1.995 13.303,2.697 14.005,5.513 15.5,8 14.005,10.487 13.303,13.303 10.487,14.005 8,15.5 5.513,14.005 2.697,13.303 1.995,10.487 0.5,8 1.995,5.513 2.697,2.697 5.513,1.995" fill="#1d9bf0"/>
        <path d="M5 8.5l2.2 2.2L11 6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`
    : "";
  return `
    <div class="siswa-card" role="button" tabindex="0" data-idx="${idx}">
      <div class="card-main">
        <div class="avatar av-${s.gender==="P"?"p":"l"}">${av}</div>
        <div class="card-info">
          <div class="card-nama">${escHtml(s.nama)}${verified}</div>
          <div class="card-badges">${s.lulus&&s.lulus!=="-"?`<span class="badge badge-gray">Lulus ${escHtml(s.lulus)}</span>`:""}</div>
        </div>
        <svg class="card-chevron" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><polyline points="6 9 12 15 18 9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>`;
}

function showModal(s) {
  const av = s.foto ? `<img src="${escHtml(s.foto)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : initials(s.nama);
  const lu = s.lulus && s.lulus !== "-" ? s.lulus : "–";
  document.getElementById("modalBody").innerHTML = `
    <div class="modal-avatar av-${s.gender==="P"?"p":"l"}">${av}</div>
    <div class="modal-grid">
      <div class="modal-item"><label>Nama Lengkap</label><span>${escHtml(s.nama)}</span></div>
      <div class="modal-item"><label>NISN</label><span>${escHtml(s.nisn)||"–"}</span></div>
      <div class="modal-item"><label>Tahun Masuk</label><span>${escHtml(s.masuk)||"–"}</span></div>
      <div class="modal-item"><label>Tahun Lulus</label><span>${escHtml(lu)}</span></div>
    </div>
    ${s.lulus && s.lulus !== "-" ? `
    <div style="margin-top:1.25rem;padding-top:1rem;border-top:1px solid rgba(0,0,0,.06);text-align:center;">
      <span style="display:inline-flex;align-items:center;gap:6px;color:#1d9bf0;font-size:11px;font-weight:700;letter-spacing:.02em;margin-bottom:10px;">
        <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true" style="flex-shrink:0;">
          <polygon points="8,0.5 10.487,1.995 13.303,2.697 14.005,5.513 15.5,8 14.005,10.487 13.303,13.303 10.487,14.005 8,15.5 5.513,14.005 2.697,13.303 1.995,10.487 0.5,8 1.995,5.513 2.697,2.697 5.513,1.995" fill="#1d9bf0"/>
          <path d="M5 8.5l2.2 2.2L11 6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        ALUMNI TERVERIFIKASI</span>
      <p style="font-size:13px;color:#6b7280;line-height:1.6;">Sesuai arsip Yayasan Baitul Hikmah, <strong>${escHtml(s.nama)}</strong> tercatat sebagai alumni <strong>${escHtml(LEMBAGA[currentIdx].nama)}</strong> yang telah menyelesaikan pendidikan pada tahun ${escHtml(s.lulus)}.</p>
    </div>` : ""}`;
  document.getElementById("modalOverlay").classList.add("show");
}

function hideModal() {
  document.getElementById("modalOverlay").classList.remove("show");
}

document.getElementById("modalOverlay").addEventListener("click", function(e) {
  if (e.target === this) hideModal();
});
document.getElementById("modalClose").addEventListener("click", hideModal);
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") hideModal();
});

document.getElementById("searchInput").addEventListener("input", e => { currentQuery = e.target.value; render(); });
document.getElementById("clearBtn").addEventListener("click", () => { const i=document.getElementById("searchInput"); i.value=""; currentQuery=""; render(); i.focus(); });
document.getElementById("listArea").addEventListener("click", function(e) {
  const card = e.target.closest(".siswa-card");
  if (!card) return;
  const idx = parseInt(card.dataset.idx);
  const hasil = window._hasilCache;
  if (hasil && hasil[idx]) showModal(hasil[idx]);
});
document.getElementById("listArea").addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") {
    const c = e.target.closest(".siswa-card");
    if (c) { e.preventDefault(); c.click(); }
  }
});

buildTabs();
switchLembaga(0);

// ══════════════════════════════════════════════════════════════
//  🎨  Background dari Pengaturan Admin
// ══════════════════════════════════════════════════════════════
(function() {
  try {
    const raw = localStorage.getItem("ybk_bg_settings");
    if (!raw) return;
    const s = JSON.parse(raw);
    if (!s.image) return;
    const test = new Image();
    test.onload = function() {
      document.documentElement.style.setProperty("--bg-image", `url(${JSON.stringify(s.image)})`);
      document.documentElement.style.setProperty("--bg-size", s.size || "cover");
      document.documentElement.style.setProperty("--bg-pos", (s.x || 50) + "% " + (s.y || 50) + "%");
    };
    test.onerror = function() {
      localStorage.removeItem("ybk_bg_settings");
    };
    test.src = s.image;
  } catch {}
})();
</script>
</body>
</html>
