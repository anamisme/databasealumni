<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin – Input Data Alumni</title>
<link rel="icon" type="image/png" href="favicon.png" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green-dark: #004d25;
    --green-main: #007a3e;
    --green-light: #e6f7ed;
    --radius-md: 14px;
    --radius-lg: 20px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,.06);
    --shadow-md: 0 8px 24px rgba(0,0,0,.08);
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 100%);
    min-height: 100vh; color: #1f2937;
  }
  .header {
    background: linear-gradient(160deg, #003d1e 0%, #006633 40%, #00944a 100%);
    padding: 2rem 1.5rem; text-align: center; position: relative; overflow: hidden;
  }
  .header::before {
    content: ''; position: absolute; top: -80px; right: -60px;
    width: 250px; height: 250px; border-radius: 50%; background: rgba(255,255,255,.04);
  }
  .header h1 { color: #fff; font-size: 20px; font-weight: 700; position: relative; z-index: 1; }
  .header p { color: rgba(255,255,255,.6); font-size: 13px; margin-top: 4px; position: relative; z-index: 1; }

  .container { max-width: 600px; margin: -2rem auto 0; padding: 0 1.25rem 3rem; position: relative; z-index: 2; }

  /* Login */
  .login-box, .form-box {
    background: #fff; border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md); padding: 2rem 1.5rem;
    border: 1px solid rgba(0,0,0,.04);
  }
  .login-box { text-align: center; }
  .login-box h2 { font-size: 18px; margin-bottom: 1rem; color: #111827; }
  .login-box input {
    width: 100%; max-width: 300px; padding: 12px 16px; border: 1.5px solid #e5e7eb;
    border-radius: 10px; font-size: 15px; text-align: center; outline: none;
    transition: border-color .2s;
  }
  .login-box input:focus { border-color: var(--green-main); }
  .login-box button {
    display: block; margin: 1rem auto 0; padding: 12px 32px;
    background: var(--green-main); color: #fff; border: none;
    border-radius: 10px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background .2s;
  }
  .login-box button:hover { background: var(--green-dark); }
  .login-error { color: #dc2626; font-size: 13px; margin-top: .75rem; display: none; }

  /* Form */
  .form-box { display: none; }
  .form-box h2 { font-size: 18px; margin-bottom: 1.5rem; color: #111827; }
  .form-group { margin-bottom: 1.1rem; }
  .form-group label {
    display: block; font-size: 12px; font-weight: 600; color: #6b7280;
    text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px;
  }
  .form-group input, .form-group select {
    width: 100%; padding: 11px 14px; border: 1.5px solid #e5e7eb;
    border-radius: 10px; font-size: 14px; outline: none; transition: border-color .2s;
    background: #fff;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--green-main); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn-submit {
    width: 100%; padding: 14px; background: var(--green-main); color: #fff;
    border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: background .2s; margin-top: .5rem;
  }
  .btn-submit:hover { background: var(--green-dark); }
  .btn-submit:disabled { background: #9ca3af; cursor: not-allowed; }

  .alert {
    margin-top: 1rem; padding: 12px 16px; border-radius: 10px;
    font-size: 14px; font-weight: 500; display: none;
  }
  .alert-success { background: #d1fae5; color: #047857; }
  .alert-error { background: #fee2e2; color: #dc2626; }

  .back-link {
    display: block; text-align: center; margin-top: 1.5rem;
    color: #6b7280; font-size: 13px; text-decoration: none;
  }
  .back-link:hover { color: var(--green-main); }

  /* ── Pengaturan Tampilan ── */
  .settings-section { margin-top: 2rem; }
  .settings-section h2 { font-size: 16px; color: #111827; margin-bottom: 1rem; }
  .settings-box {
    background: #fff; border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md); padding: 1.5rem;
    border: 1px solid rgba(0,0,0,.04);
  }
  .bg-preview {
    width: 100%; height: 140px; border-radius: 10px;
    background: linear-gradient(145deg, #1a4d2e 0%, #0d7a3e 30%, #2ea06a 60%, #1a6b42 100%);
    background-size: cover; background-position: center;
    margin-bottom: 1rem; border: 1.5px solid #e5e7eb;
    transition: background .3s;
  }
  .bg-upload-row { display: flex; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; }
  .bg-upload-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 18px; background: var(--green-main); color: #fff;
    border-radius: 10px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background .2s; border: none;
  }
  .bg-upload-btn:hover { background: var(--green-dark); }
  .bg-upload-btn input { display: none; }
  .bg-reset-btn {
    padding: 10px 18px; background: #f3f4f6; color: #6b7280;
    border-radius: 10px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .2s; border: 1px solid #e5e7eb;
  }
  .bg-reset-btn:hover { background: #fee2e2; color: #dc2626; border-color: #fecaca; }
  .bg-control { margin-bottom: 1rem; }
  .bg-control:last-child { margin-bottom: 0; }
  .bg-control label {
    display: block; font-size: 12px; font-weight: 600; color: #6b7280;
    text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px;
  }
  .bg-control select {
    width: 100%; padding: 10px 14px; border: 1.5px solid #e5e7eb;
    border-radius: 10px; font-size: 14px; outline: none;
    background: #fff; transition: border-color .2s;
  }
  .bg-control select:focus { border-color: var(--green-main); }
  .bg-control input[type="range"] {
    width: 100%; height: 6px; -webkit-appearance: none; appearance: none;
    background: #e5e7eb; border-radius: 3px; outline: none;
  }
  .bg-control input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px;
    border-radius: 50%; background: var(--green-main);
    cursor: pointer; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.15);
  }
  .bg-range-val { font-size: 13px; color: #374151; font-weight: 500; }
  .bg-save-btn {
    width: 100%; padding: 12px; background: var(--green-main); color: #fff;
    border: none; border-radius: 12px; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: background .2s; margin-top: .5rem;
  }
  .bg-save-btn:hover { background: var(--green-dark); }
  .bg-save-msg { font-size: 13px; text-align: center; margin-top: 8px; display: none; }
  .bg-save-msg.success { color: #047857; }
  .bg-save-msg.error { color: #dc2626; }

  @media (max-width: 480px) {
    .form-row { grid-template-columns: 1fr; }
    .container { padding: 0 1rem 2rem; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🔐 Panel Admin</h1>
  <p>Input Data Alumni – Yayasan Baitul Hikmah</p>
</div>

<div class="container">

  <!-- Login -->
  <div class="login-box" id="loginBox">
    <h2>Masukkan Password Admin</h2>
    <input type="password" id="passInput" placeholder="Password" />
    <button onclick="doLogin()">Masuk</button>
    <p class="login-error" id="loginError">Password salah!</p>
  </div>

  <!-- Form Input -->
  <div class="form-box" id="formBox">
    <h2>Tambah Data Alumni</h2>
    <form id="alumniForm" onsubmit="submitForm(event)">

      <div class="form-group">
        <label>Lembaga</label>
        <select id="fLembaga" required>
          <option value="">– Pilih Lembaga –</option>
          <option value="MTs">MTS Al-Hikmah Tangkil Kulon</option>
          <option value="MIS">MIS Al-Hikmah Tangkil Kulon</option>
          <option value="PKBM">PKBM Al-Hikmah</option>
          <option value="KB">KB Al-Hikmah</option>
        </select>
      </div>

      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="fNama" required placeholder="Nama lengkap alumni" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>NISN</label>
          <input type="text" id="fNisn" placeholder="10 digit NISN" />
        </div>
        <div class="form-group">
          <label>Jenis Kelamin</label>
          <select id="fGender" required>
            <option value="">– Pilih –</option>
            <option value="L">Laki-laki</option>
            <option value="P">Perempuan</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Tahun Masuk</label>
          <select id="fMasuk" required>
            <option value="">– Pilih –</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tahun Lulus</label>
          <select id="fLulus" required>
            <option value="">– Pilih –</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Link Foto (Google Drive)</label>
        <input type="url" id="fFoto" placeholder="Paste link Google Drive foto alumni" />
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">Simpan Data Alumni</button>
    </form>

    <div class="alert alert-success" id="alertSuccess">✅ Data berhasil disimpan ke spreadsheet!</div>
    <div class="alert alert-error" id="alertError">❌ Gagal menyimpan data. Coba lagi.</div>
  </div>

  <!-- Pengaturan Tampilan -->
  <div class="settings-section" id="settingsSection" style="display:none;">
    <h2>🎨 Pengaturan Tampilan</h2>
    <div class="settings-box">
      <div class="bg-preview" id="bgPreview"></div>
      <div class="bg-upload-row">
        <label class="bg-upload-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Upload Gambar Background
          <input type="file" accept="image/*" id="bgFileInput">
        </label>
        <button class="bg-reset-btn" id="bgResetBtn">Reset Default</button>
      </div>
      <div class="bg-control">
        <label>Ukuran</label>
        <select id="bgSize">
          <option value="cover">Cover — penuhi layar (terpotong)</option>
          <option value="contain">Contain — tampilkan semua</option>
          <option value="auto">Auto — ukuran asli</option>
          <option value="100% 100%">Stretch — regangkan</option>
        </select>
      </div>
      <div class="bg-control">
        <label>Posisi Horizontal: <span class="bg-range-val" id="bgXVal">50%</span></label>
        <input type="range" min="0" max="100" value="50" id="bgPosX">
      </div>
      <div class="bg-control">
        <label>Posisi Vertikal: <span class="bg-range-val" id="bgYVal">50%</span></label>
        <input type="range" min="0" max="100" value="50" id="bgPosY">
      </div>
      <button class="bg-save-btn" id="bgSaveBtn">Simpan Pengaturan</button>
      <p class="bg-save-msg" id="bgSaveMsg"></p>
    </div>
  </div>

  <a href="index.html" class="back-link">← Kembali ke halaman pencarian</a>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  ⚙️  KONFIGURASI
// ══════════════════════════════════════════════════════════════

// Password admin (di-hash untuk keamanan)
const EXPECTED_HASH = "4a3qya";

// URL Google Apps Script Web App
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxzN7qBZDBqcXYTFhcQymhAmUdaD_A_XBaQA1v_7VW6uvOvL-3-L7FosGyqOzC_ft8/exec";

// ══════════════════════════════════════════════════════════════

function simpleHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const char = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash = hash & hash;
  }
  return hash.toString(36);
}

function doLogin() {
  const pass = document.getElementById("passInput").value;
  if (simpleHash(pass) === EXPECTED_HASH) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("formBox").style.display = "block";
  } else {
    document.getElementById("loginError").style.display = "block";
  }
}

document.getElementById("passInput").addEventListener("keydown", e => {
  if (e.key === "Enter") doLogin();
});

function submitForm(e) {
  e.preventDefault();

  // Rate limiting: max 1 submit per 5 detik
  if (submitForm.lastSubmit && Date.now() - submitForm.lastSubmit < 5000) {
    alert("Tunggu beberapa detik sebelum mengirim lagi.");
    return;
  }

  // Konfirmasi sebelum simpan
  const nama = document.getElementById("fNama").value.trim();
  const lembaga = document.getElementById("fLembaga");
  const lembagaText = lembaga.options[lembaga.selectedIndex].text;
  if (!confirm(`Yakin data sudah benar?\n\nNama: ${nama}\nLembaga: ${lembagaText}`)) {
    return;
  }

  const btn = document.getElementById("btnSubmit");
  const alertOk = document.getElementById("alertSuccess");
  const alertErr = document.getElementById("alertError");
  alertOk.style.display = "none";
  alertErr.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Menyimpan…";
  submitForm.lastSubmit = Date.now();

  const data = {
    lembaga:  document.getElementById("fLembaga").value,
    nama:     nama,
    nisn:     document.getElementById("fNisn").value.trim(),
    gender:   document.getElementById("fGender").value,
    masuk:    document.getElementById("fMasuk").value,
    lulus:    document.getElementById("fLulus").value,
    foto:     document.getElementById("fFoto").value.trim(),
  };

  fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(data),
  })
  .then(r => r.json())
  .then(res => {
    if (res.status === "success") {
      alertOk.style.display = "block";
      document.getElementById("alumniForm").reset();
    } else {
      alertErr.style.display = "block";
    }
  })
  .catch(() => {
    alertErr.style.display = "block";
  })
  .finally(() => {
    btn.disabled = false;
    btn.textContent = "Simpan Data Alumni";
  });
}
// ══════════════════════════════════════════════════════════════
//  🎨  PENGATURAN BACKGROUND
// ══════════════════════════════════════════════════════════════

const BG_KEY = "ybk_bg_settings";

function loadBgSettings() {
  try {
    const raw = localStorage.getItem(BG_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function saveBgSettings(data) {
  localStorage.setItem(BG_KEY, JSON.stringify(data));
}

function applyBgPreview() {
  const preview = document.getElementById("bgPreview");
  const size = document.getElementById("bgSize").value;
  const x = document.getElementById("bgPosX").value;
  const y = document.getElementById("bgPosY").value;
  const saved = loadBgSettings();
  const img = saved?.image || "";
  if (img) {
    preview.style.backgroundImage = `url(${JSON.stringify(img)})`;
  } else {
    preview.style.backgroundImage = "none";
  }
  preview.style.backgroundSize = size;
  preview.style.backgroundPosition = `${x}% ${y}%`;
}

function initBgSettings() {
  const saved = loadBgSettings();
  if (saved) {
    document.getElementById("bgSize").value = saved.size || "cover";
    document.getElementById("bgPosX").value = saved.x || 50;
    document.getElementById("bgPosY").value = saved.y || 50;
    document.getElementById("bgXVal").textContent = (saved.x || 50) + "%";
    document.getElementById("bgYVal").textContent = (saved.y || 50) + "%";
  }
  applyBgPreview();
}

document.getElementById("bgFileInput").addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const data = loadBgSettings() || {};
    data.image = ev.target.result;
    saveBgSettings(data);
    applyBgPreview();
    document.getElementById("bgSaveMsg").textContent = "Gambar tersimpan!";
    document.getElementById("bgSaveMsg").className = "bg-save-msg success";
    document.getElementById("bgSaveMsg").style.display = "block";
    setTimeout(() => document.getElementById("bgSaveMsg").style.display = "none", 2500);
  };
  reader.readAsDataURL(file);
});

document.getElementById("bgResetBtn").addEventListener("click", function() {
  localStorage.removeItem(BG_KEY);
  document.getElementById("bgSize").value = "cover";
  document.getElementById("bgPosX").value = 50;
  document.getElementById("bgPosY").value = 50;
  document.getElementById("bgXVal").textContent = "50%";
  document.getElementById("bgYVal").textContent = "50%";
  applyBgPreview();
  document.getElementById("bgSaveMsg").textContent = "Kembali ke default!";
  document.getElementById("bgSaveMsg").className = "bg-save-msg success";
  document.getElementById("bgSaveMsg").style.display = "block";
  setTimeout(() => document.getElementById("bgSaveMsg").style.display = "none", 2500);
});

document.getElementById("bgSize").addEventListener("change", applyBgPreview);
document.getElementById("bgPosX").addEventListener("input", function() {
  document.getElementById("bgXVal").textContent = this.value + "%";
  applyBgPreview();
});
document.getElementById("bgPosY").addEventListener("input", function() {
  document.getElementById("bgYVal").textContent = this.value + "%";
  applyBgPreview();
});

document.getElementById("bgSaveBtn").addEventListener("click", function() {
  const data = loadBgSettings() || {};
  data.size = document.getElementById("bgSize").value;
  data.x = parseInt(document.getElementById("bgPosX").value);
  data.y = parseInt(document.getElementById("bgPosY").value);
  if (!data.image) {
    document.getElementById("bgSaveMsg").textContent = "Belum ada gambar yang diupload.";
    document.getElementById("bgSaveMsg").className = "bg-save-msg error";
    document.getElementById("bgSaveMsg").style.display = "block";
    setTimeout(() => document.getElementById("bgSaveMsg").style.display = "none", 2500);
    return;
  }
  saveBgSettings(data);
  document.getElementById("bgSaveMsg").textContent = "Pengaturan tersimpan!";
  document.getElementById("bgSaveMsg").className = "bg-save-msg success";
  document.getElementById("bgSaveMsg").style.display = "block";
  setTimeout(() => document.getElementById("bgSaveMsg").style.display = "none", 2500);
});

// Tampilkan pengaturan setelah login
const origDoLogin = doLogin;
doLogin = function() {
  const pass = document.getElementById("passInput").value;
  if (simpleHash(pass) === EXPECTED_HASH) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("formBox").style.display = "block";
    document.getElementById("settingsSection").style.display = "block";
    initBgSettings();
  } else {
    document.getElementById("loginError").style.display = "block";
  }
};

// ── Init: populate tahun dropdown ──────────────────────────────
(function() {
  const currentYear = new Date().getFullYear();
  const startYear = 2000;
  const selMasuk = document.getElementById("fMasuk");
  const selLulus = document.getElementById("fLulus");
  for (let y = currentYear; y >= startYear; y--) {
    selMasuk.innerHTML += `<option value="${y}">${y}</option>`;
    selLulus.innerHTML += `<option value="${y}">${y}</option>`;
  }
})();
</script>
</body>
</html>
